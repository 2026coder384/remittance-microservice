name: Manual Release Pipeline (With Change Request)

on:
  workflow_dispatch:
    inputs:
      change_request_id:
        description: 'ServiceNow Change Request ID (e.g., CHG004602)'
        required: true
        default: 'CHG004602'
      image_tag:
        description: 'Docker Image Version Tag (e.g., v1.3-trivy)'
        required: true
        default: 'v1.3-trivy'

jobs:
  build-and-govern-release:
    runs-on: ubuntu-latest
    steps:
      - name: Log Change Management Audit Details
        run: |
          echo "Approved Change Request: ${{ github.event.inputs.change_request_id }}"
          echo "Building Release Version: ${{ github.event.inputs.image_tag }}"

      - name: Checkout code from GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DevSecOps Gate 1 - Scan Code for Hardcoded Secrets (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source="/repo" --verbose

      - name: Build Versioned Docker Image
        run: docker build -t remittance-api:${{ github.event.inputs.image_tag }} .

      - name: DevSecOps Gate 2 - Scan Docker Image for Vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --ignore-unfixed remittance-api:${{ github.event.inputs.image_tag }}
